name: Security CI Pipeline

on:
  push:
  pull_request:

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm install -g nyc

      # 4. Run Semgrep using Docker
      - name: Run Semgrep
        continue-on-error: true   # <--- CI не падает, даже если найдены уязвимости
        run: |
          docker run --rm -v ${{ github.workspace }}:/src returntocorp/semgrep semgrep --config p/ci -a || true

      # 5. Run SonarCloud Scan
      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true   # <--- CI не падает, даже если есть ошибки
        with:
          projectKey: "juice-shop-123"          
          organization: "juice-shop-123"        
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 6. Run Dependency-Check
      - name: Run Dependency-Check
        continue-on-error: true   # <--- CI не падает при уязвимостях
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Juice Shop Security"
          path: "."
          format: "HTML"
          out: "./reports"

      # 7. Upload all reports
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            ./reports
            # если есть отчёты Semgrep и SonarCloud, можно добавить пути
            # ./semgrep-report.html
            # ./sonar-report.json
