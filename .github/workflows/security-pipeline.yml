name: Security CI Pipeline

on:
  push:
  pull_request:

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          # Use npm ci if package-lock.json exists, otherwise npm install
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm install -g nyc

      # 4. Run Semgrep using Docker
      - name: Run Semgrep
        run: |
          docker run --rm -v ${{ github.workspace }}:/src returntocorp/semgrep semgrep --config p/ci -a

      # 5. Run SonarCloud Scan
      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectKey: "juice-shop-123"          # твой Project Key из SonarCloud
          organization: "juice-shop-123"        # твой Organization Key из SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # токен из GitHub Secrets

      # 6. Run Dependency-Check
      - name: Run Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Juice Shop Security"
          path: "."
          format: "HTML"
          out: "./reports"

      # 7. Upload reports
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: "./reports"
